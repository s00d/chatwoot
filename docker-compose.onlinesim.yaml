# OnlineSIM / self-hosted production compose
# Builds the image from this repo (Docker compiles Vite + SDK — nothing from public/packs in git).
#
# Usage:
#   cp .env.example .env   # then edit
#   docker compose -f docker-compose.onlinesim.yaml build
#   docker compose -f docker-compose.onlinesim.yaml run --rm rails bundle exec rails db:chatwoot_prepare
#   docker compose -f docker-compose.onlinesim.yaml up -d
#
# See dev/01-docker-from-scratch.md

services:
  base: &base
    image: ${CHATWOOT_IMAGE:-chatwoot-onlinesim:local}
    # When CHATWOOT_IMAGE points to a registry tag, prefer:
    #   docker compose -f docker-compose.onlinesim.yaml pull
    #   docker compose -f docker-compose.onlinesim.yaml up -d --no-build
    build:
      context: .
      dockerfile: ./docker/Dockerfile
      args:
        RAILS_ENV: production
        RAILS_SERVE_STATIC_FILES: 'true'
        BUNDLE_WITHOUT: 'development:test'
    env_file: .env
    volumes:
      - storage_data:/app/storage
      - avatars_data:/app/avatars
    restart: always

  rails:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - '${CHATWOOT_BIND:-127.0.0.1:3000}:3000'
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-p', '3000', '-b', '0.0.0.0']

  sidekiq:
    <<: *base
    depends_on:
      - postgres
      - redis
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']

  postgres:
    image: pgvector/pgvector:pg16
    restart: always
    ports:
      - '${POSTGRES_BIND:-127.0.0.1:5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-chatwoot}
      - POSTGRES_USER=${POSTGRES_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}

  redis:
    image: redis:alpine
    restart: always
    command: ['sh', '-c', 'redis-server --requirepass "$$REDIS_PASSWORD" --databases 16']
    env_file: .env
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_BIND:-127.0.0.1:6379}:6379'

volumes:
  storage_data:
  avatars_data:
  postgres_data:
  redis_data:
