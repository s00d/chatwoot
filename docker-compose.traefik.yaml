# Traefik in front of Chatwoot: Let's Encrypt certificates, HTTP -> HTTPS, gzip, websockets (/cable).
# Use instead of host nginx, as an overlay on docker-compose.onlinesim.yaml.
#
# .env:
#   CHATWOOT_DOMAINS=chatwoot.example.com,chatwoot.example.org,docs.example.com
#   ACME_EMAIL=admin@example.com              # Let's Encrypt expiry notices
#   FRONTEND_URL=https://chatwoot.example.com # main domain: links and files are generated for it
#   FORCE_SSL=true
#
# Every domain in CHATWOOT_DOMAINS gets its own certificate; their A records must point at this
# server and ports 80/443 must be free. The routing is generated from the list at start
# (docker/traefik/entrypoint.sh), so changing domains means editing .env and recreating traefik.
#
# Start:
#   docker compose -f docker-compose.onlinesim.yaml -f docker-compose.traefik.yaml up -d

services:
  traefik:
    image: traefik:v3.7.15
    restart: always
    depends_on:
      - rails
    entrypoint: ['/bin/sh', '/traefik-entrypoint.sh']
    command:
      - --providers.file.filename=/etc/traefik/chatwoot.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    environment:
      - CHATWOOT_DOMAINS=${CHATWOOT_DOMAINS:?set CHATWOOT_DOMAINS in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/traefik/entrypoint.sh:/traefik-entrypoint.sh:ro
      - letsencrypt:/letsencrypt

volumes:
  letsencrypt:
