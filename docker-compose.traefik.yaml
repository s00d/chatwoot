# Traefik in front of Chatwoot: Let's Encrypt certificates, HTTP -> HTTPS, gzip, websockets (/cable).
# Use instead of host nginx, as an overlay on docker-compose.onlinesim.yaml.
#
# .env, one domain:
#   CHATWOOT_DOMAIN=chatwoot.example.com      # A record must point at this server, ports 80/443 open
#   ACME_EMAIL=admin@example.com              # Let's Encrypt expiry notices
#   FRONTEND_URL=https://chatwoot.example.com
#   FORCE_SSL=true
#
# Several domains (extra dashboard domains, help center custom domains): set the full rule instead,
# Traefik issues a certificate for every host in it. Keep the single quotes.
#   CHATWOOT_HOST_RULE='Host(`chatwoot.example.com`) || Host(`chatwoot.example.org`) || Host(`docs.example.com`)'
# Links and files are still generated for FRONTEND_URL, so point it at the main domain.
#
# Start:
#   docker compose -f docker-compose.onlinesim.yaml -f docker-compose.traefik.yaml up -d

services:
  traefik:
    image: traefik:v3.7.15
    restart: always
    command:
      - --providers.docker=true
      # only containers with traefik.enable=true are exposed
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --log.level=INFO
      - --accesslog=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt

  rails:
    labels:
      - traefik.enable=true
      - traefik.http.routers.chatwoot.rule=${CHATWOOT_HOST_RULE:-Host(`${CHATWOOT_DOMAIN:?set CHATWOOT_DOMAIN or CHATWOOT_HOST_RULE in .env}`)}
      - traefik.http.routers.chatwoot.entrypoints=websecure
      - traefik.http.routers.chatwoot.tls.certresolver=le
      - traefik.http.routers.chatwoot.middlewares=chatwoot-compress,chatwoot-hsts
      - traefik.http.services.chatwoot.loadbalancer.server.port=3000
      # JS/CSS/JSON from the app go out compressed (the dashboard bundle is several MB raw)
      - traefik.http.middlewares.chatwoot-compress.compress=true
      - traefik.http.middlewares.chatwoot-hsts.headers.stsSeconds=31536000
      - traefik.http.middlewares.chatwoot-hsts.headers.stsIncludeSubdomains=true

volumes:
  letsencrypt:
