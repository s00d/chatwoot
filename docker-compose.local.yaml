# Local Docker dev — ports that do not clash with host nginx / postgres / redis.
#
# IMPORTANT: overrides host .env (POSTGRES_HOST=localhost) with .env.docker (postgres/redis services).
#
# Usage:
#   cp dev/.env.docker.local.example .env.docker
#   export DOCKER_BUILDKIT=1
#   docker compose --env-file .env.docker -f docker-compose.yaml -f docker-compose.local.yaml up -d
#   docker compose --env-file .env.docker -f docker-compose.yaml -f docker-compose.local.yaml run --rm rails bundle exec rails db:chatwoot_prepare
#
# UI: http://127.0.0.1:3041 — john@acme.inc / Password1!

services:
  base:
    env_file: !override
      - .env.docker

  rails:
    env_file: !override
      - .env.docker
    # Assets come from the bundle the vite service keeps rebuilding (public/vite-dev).
    # The Vite dev server serves ~4000 unbundled modules per page through the Rails proxy,
    # which freezes the browser; Rails must not start its own build either.
    environment:
      - VITE_RUBY_AUTO_BUILD=false
      # re-read the manifest on each request (config/initializers/vite_ruby_manifest_refresh.rb)
      - VITE_RUBY_REFRESH_MANIFEST=true
    ports: !override
      - '127.0.0.1:3041:3000'

  sidekiq:
    env_file: !override
      - .env.docker

  vite:
    env_file: !override
      - .env.docker
    # upstream docker/entrypoints/vite.sh runs `pnpm store prune` + `pnpm install --force`, re-downloading
    # every package on each start; node_modules lives in a volume, so a plain install is enough
    entrypoint: ['sh', '-c', 'pnpm install --frozen-lockfile && exec "$$@"', 'vite']
    # One build, then the container exits and frees its memory: `vite build --watch` keeps the module graph
    # (~2 GB) and gets OOM-killed on the first rebuild with Docker's default 5 GB. Rebuild after frontend edits:
    #   docker compose --env-file .env.docker -f docker-compose.yaml -f docker-compose.local.yaml run --rm vite
    command: ['bin/vite', 'build', '--force', '--mode', 'development']
    restart: 'no'
    environment:
      # the frontend build needs ~3.5 GB of heap; Node's default (~2 GB) runs out of memory
      - NODE_OPTIONS=--max-old-space-size=3584
    ports: !override []

  postgres:
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: !override
      - '127.0.0.1:55433:5432'

  redis:
    ports: !override
      - '127.0.0.1:6380:6379'

  mailhog:
    ports: !override
      - '127.0.0.1:1026:1025'
      - '127.0.0.1:8026:8025'
