# Manual-only Docker image build & push for OnlineSIM Chatwoot fork.
# Does NOT run on push. Trigger: Actions → "Deploy Docker (manual)" → Run workflow.
#
# Required GitHub secrets / variables: see dev/04-github-actions-and-env.md

name: Deploy Docker (manual)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag (e.g. v4.16.2-onlinesim, staging, latest)'
        required: true
        default: 'staging'
      push:
        description: 'Push image to registry'
        type: boolean
        default: true
      registry:
        description: 'Registry host (ghcr.io or docker.io)'
        required: true
        default: 'ghcr.io'

env:
  # Override via repo Variables: DOCKER_IMAGE_NAME (e.g. myorg/chatwoot)
  IMAGE_NAME: ${{ vars.DOCKER_IMAGE_NAME }}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        run: |
          NAME="${{ env.IMAGE_NAME }}"
          if [ -z "$NAME" ]; then
            NAME="${{ github.repository }}"
          fi
          REGISTRY="${{ inputs.registry }}"
          TAG="${{ inputs.image_tag }}"
          # docker.io/user/repo vs ghcr.io/owner/repo
          if [ "$REGISTRY" = "docker.io" ]; then
            FULL="$NAME:$TAG"
          else
            FULL="$REGISTRY/$NAME:$TAG"
          fi
          echo "full_image=$FULL" >> "$GITHUB_OUTPUT"
          echo "Building: $FULL"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: inputs.registry == 'ghcr.io' && inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: inputs.registry == 'docker.io' && inputs.push
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and optionally push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.full_image }}
          build-args: |
            RAILS_ENV=production
            RAILS_SERVE_STATIC_FILES=true
            BUNDLE_WITHOUT=development:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Assets are compiled INSIDE the Dockerfile — no public/packs in git

      - name: Summary
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo '\`${{ steps.meta.outputs.full_image }}\`' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "On the server:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "export CHATWOOT_IMAGE=${{ steps.meta.outputs.full_image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose -f docker-compose.onlinesim.yaml pull   # if using registry image" >> "$GITHUB_STEP_SUMMARY"
          echo "# or rebuild locally: docker compose -f docker-compose.onlinesim.yaml build" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose -f docker-compose.onlinesim.yaml run --rm rails bundle exec rails db:chatwoot_prepare" >> "$GITHUB_STEP_SUMMARY"
          echo "docker compose -f docker-compose.onlinesim.yaml up -d" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
